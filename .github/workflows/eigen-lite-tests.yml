name: eigen-lite CLI tests

on:
  push:
    branches: [master, dev]
    paths:
      - 'plugins/eigen-lite/cli/**'
      - 'plugins/eigen-lite/_vendored/**'
      - 'plugins/eigen-lite/.claude-plugin/plugin.json'
      - 'plugins/eigen-core/eigen_core/**'
      - '.github/workflows/eigen-lite-tests.yml'
  pull_request:
    paths:
      - 'plugins/eigen-lite/cli/**'
      - 'plugins/eigen-lite/_vendored/**'
      - 'plugins/eigen-lite/.claude-plugin/plugin.json'
      - 'plugins/eigen-core/eigen_core/**'
      - '.github/workflows/eigen-lite-tests.yml'

jobs:
  lite-tests:
    name: eigen-lite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    defaults:
      run:
        working-directory: plugins/eigen-lite

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: pip install pytest

      - name: Run CLI tests
        run: pytest cli/tests/ -v --tb=short

      - name: Verify test count
        run: |
          count=$(pytest cli/tests/ --collect-only -q 2>&1 | tail -1 | awk '{print $1}')
          echo "Collected $count tests"
          if [ "$count" -lt 139 ]; then
            echo "::error::Test count ($count) below baseline (139). Did tests get deleted?"
            exit 1
          fi
